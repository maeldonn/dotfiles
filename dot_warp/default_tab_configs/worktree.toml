name = "Worktree"

[[panes]]
id = "main"
type = "{{pane_type}}"
directory = "{{repo}}"
commands = [
  "mkdir -p \"$(dirname \"{{worktree_path_prefix}}{{autogenerated_branch_name}}\")\" && if jj root >/dev/null 2>&1; then jj workspace add \"{{worktree_path_prefix}}{{autogenerated_branch_name}}\"; else git worktree add -b \"{{autogenerated_branch_name}}\" \"{{worktree_path_prefix}}{{autogenerated_branch_name}}\"; fi",
  "cd \"{{worktree_path_prefix}}{{autogenerated_branch_name}}\"",
]

[params.repo]
type = "repo"
description = "Repository to create worktree in"

[params.pane_type]
type = "text"
description = "Pane type (terminal or agent)"
default = "terminal"
